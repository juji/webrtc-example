name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://webrtc:webrtc@localhost:5432/webrtc
      RUSTFS_ENDPOINT: http://localhost:9000
      RUSTFS_ACCESS_KEY: webrtc
      RUSTFS_SECRET_KEY: webrtcsecret
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
      # Optional: only needed for NAT traversal, not for same-machine CI browsers.
      METERED_APP_NAME: ${{ secrets.METERED_APP_NAME }}
      METERED_API_KEY: ${{ secrets.METERED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      # server/src/session.ts and server/src/push.ts both throw at
      # import/request time if these are unset (JWT signing, VAPID push) —
      # the server crashes on boot without them. Throwaway values, regenerated
      # every run: CI never needs a stable JWT/push identity across runs.
      - name: Generate JWT_SECRET and VAPID keys
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          # bunx always prints its own "Resolving dependencies..." resolution
          # noise to stdout before the command's real output, even when the
          # package is already installed — grep out everything but the one
          # JSON line the command itself produces.
          bunx web-push generate-vapid-keys --json | grep '^{' > vapid.json
          echo "VAPID_PUBLIC_KEY=$(node -pe 'JSON.parse(require("fs").readFileSync("vapid.json")).publicKey')" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=$(node -pe 'JSON.parse(require("fs").readFileSync("vapid.json")).privateKey')" >> "$GITHUB_ENV"
          rm vapid.json

      - name: Start Postgres + RustFS
        run: docker compose up -d

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U webrtc && break
            sleep 1
          done

      - name: Push DB schema
        run: bun run db:push
        working-directory: server

      - name: Start dev servers
        run: bun run --filter '*' dev &

      - name: Wait for servers
        run: |
          for i in $(seq 1 60); do
            # GET /users/:id requires a session (401 unauthenticated), but only
            # once the server is actually listening — reliably distinguishes
            # "up" from "not up yet" without depending on any seeded data.
            curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/users/00000000-0000-0000-0000-000000000000 | grep -q 401 && curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done

      # Next.js dev mode compiles each route on demand, the first time it's
      # requested — /chat was never hit before the e2e tests' first real
      # login, so that on-demand compile (plus the Fast Refresh cycle it
      # triggers) landed right in the middle of the post-login navigation,
      # slow enough in CI that the navigation never actually completed even
      # though the underlying RSC fetch eventually returned 200. Warming both
      # routes up-front means the real test run never hits a cold compile.
      - name: Warm up Next.js routes
        run: |
          curl -sf http://localhost:3000/ > /dev/null
          curl -sf http://localhost:3000/chat > /dev/null

      - name: Run e2e tests
        run: bun run test:e2e
        env:
          E2E_DEBUG: "1"

      - name: Docker logs on failure
        if: failure()
        run: docker compose logs
