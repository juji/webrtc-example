services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webrtc
      POSTGRES_PASSWORD: webrtc
      POSTGRES_DB: webrtc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: webrtc
      RUSTFS_SECRET_KEY: webrtcsecret
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000,https://webrtc-client.jujitest.com
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Provisions the `attachments` bucket and its 1-day expiry lifecycle rule —
  # infra setup, not something app code should trigger implicitly on first
  # upload (see plans/encryption/discussion.md: encrypting `messages.file`
  # means the server can no longer read the S3 key back out to delete objects
  # itself, so expiry has to be a real bucket policy, not app-triggered
  # DeleteObjectCommand calls). Runs once per `docker compose up` and exits.
  rustfs-init:
    image: rustfs/rc
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: sh
    command:
      - -c
      - |
        rc alias set local http://rustfs:9000 webrtc webrtcsecret &&
        rc mb local/attachments --ignore-existing &&
        rc ilm rule add local/attachments --expiry-days 1

  coturn:
    image: coturn/coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${COTURN_SECRET}
      - --realm=webrtc.local
      - --external-ip=${COTURN_EXTERNAL_IP}

volumes:
  postgres-data:
  rustfs-data:
