services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: webrtc
      POSTGRES_PASSWORD: webrtc
      POSTGRES_DB: webrtc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rustfs:
    image: rustfs/rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: webrtc
      RUSTFS_SECRET_KEY: webrtcsecret
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:3000,https://webrtc-client.jujitest.com
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

volumes:
  postgres-data:
  rustfs-data:
