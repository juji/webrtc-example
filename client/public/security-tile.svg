<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="security-tile" width="400" height="400" patternUnits="userSpaceOnUse">
      <rect width="400" height="400" fill="#0a0a0a" />

      <!-- Icon positions: one per 4x3 grid cell (guarantees even quadrant
           coverage) plus jitter, generated by script and verified —
           min pairwise distance 80px, quadrant counts 3/3/3/3. Filler
           positions: finer 8x6 grid, script-checked against every icon
           and every other filler for real minimum clearance. Nothing here
           is hand-placed. -->
      <g stroke="#27272a" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- lock -->
        <g transform="translate(360,166) rotate(-8,14,17)">
          <rect x="0" y="14" width="28" height="20" rx="3" />
          <path d="M6 14 V8 a8 8 0 0 1 16 0 v6" />
          <circle cx="14" cy="24" r="2" fill="#27272a" stroke="none" />
        </g>

        <!-- image -->
        <g transform="translate(314,317) rotate(10,13,10)">
          <rect x="0" y="0" width="26" height="20" rx="2" />
          <circle cx="7" cy="7" r="2" fill="#27272a" stroke="none" />
          <path d="M2 17 L10 10 L15 15 L20 9 L24 14" />
        </g>

        <!-- send / paper plane -->
        <g transform="translate(324,59) rotate(18,11,11)">
          <path d="M1 11 L21 1 L13 21 L10 13 L1 11 Z" />
        </g>

        <!-- bell -->
        <g transform="translate(214,326) rotate(-10,11,12)">
          <path d="M11 1 a7 7 0 0 1 7 7 v4 l2 4 H2 l2 -4 v-4 a7 7 0 0 1 7 -7 Z" />
          <path d="M8 20 a3 3 0 0 0 6 0" />
        </g>

        <!-- attachment / paperclip -->
        <g transform="translate(66,336) rotate(18,10,14)">
          <path d="M18 5 L8 15 a4 4 0 0 0 6 6 L23 12 a7 7 0 0 0 -10 -10 L4 11 a10 10 0 0 0 14 14" />
        </g>

        <!-- fingerprint -->
        <g transform="translate(43,158) rotate(-15,12,17)">
          <path d="M12 2 C5 2 0 8 0 15 v6" />
          <path d="M12 6 C7 6 4 10 4 15 v8" />
          <path d="M12 10 C9 10 8 12 8 15 v10" />
          <path d="M12 2 C19 2 24 8 24 15 v3" />
          <path d="M12 6 C17 6 20 10 20 15 v6" />
        </g>

        <!-- video camera -->
        <g transform="translate(146,295) rotate(-8,15,10)">
          <rect x="0" y="2" width="18" height="16" rx="2" />
          <path d="M18 8 L28 3 V17 L18 12 Z" />
        </g>

        <!-- shield -->
        <g transform="translate(118,54) rotate(-14,16,17)">
          <path d="M16 0 L30 6 V18 C30 28 16 34 16 34 C16 34 2 28 2 18 V6 Z" />
          <path d="M9 17 L14 22 L23 11" />
        </g>

        <!-- file -->
        <g transform="translate(19,48) rotate(12,10,13)">
          <path d="M2 0 H14 L20 6 V26 H2 Z" />
          <path d="M14 0 V6 H20" />
        </g>

        <!-- key -->
        <g transform="translate(245,198) rotate(-20,7,7)">
          <circle cx="7" cy="7" r="7" />
          <line x1="12" y1="12" x2="32" y2="32" />
          <line x1="24" y1="24" x2="24" y2="31" />
          <line x1="29" y1="29" x2="29" y2="34" />
        </g>

        <!-- record / mic -->
        <g transform="translate(246,72) rotate(6,7,15)">
          <rect x="2" y="0" width="10" height="18" rx="5" />
          <path d="M0 12 a7 7 0 0 0 14 0" />
          <line x1="7" y1="19" x2="7" y2="24" />
          <line x1="2" y1="24" x2="12" y2="24" />
        </g>

        <!-- message bubble -->
        <g transform="translate(119,196) rotate(6,13,10)">
          <path d="M0 4 a4 4 0 0 1 4 -4 h18 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 H9 l-6 5 v-5 H4 a4 4 0 0 1 -4 -4 Z" />
        </g>
      </g>

      <!-- fillers -->
      <circle cx="21" cy="104" r="3.5" fill="#27272a" />
      <circle cx="70" cy="108" r="3.5" fill="#27272a" />
      <circle cx="175" cy="22" r="4" fill="#27272a" />
      <circle cx="176" cy="240" r="4" fill="#27272a" />
      <circle cx="133" cy="356" r="3.5" fill="#27272a" />
      <circle cx="326" cy="237" r="4" fill="#27272a" />
      <circle cx="34" cy="248" r="3.5" fill="#27272a" />
      <circle cx="386" cy="373" r="4" fill="#27272a" />
      <circle cx="87" cy="165" r="3.5" fill="#27272a" />

      <g stroke="#27272a" stroke-width="2" stroke-linecap="round">
        <!-- plus marks -->
        <path d="M220 86 h10 M225 81 v10" />
        <path d="M311 159 h10 M316 154 v10" />
        <path d="M10 364 h10 M15 359 v10" />
        <!-- small waves -->
        <path d="M71 225 q3 -6 6 0 t6 0" />
        <path d="M110 32 q3 5 6 0 t6 0" />
        <!-- tiny x marks -->
        <path d="M18 20 l8 8 M26 20 l-8 8" />
        <path d="M269 286 l8 8 M277 286 l-8 8" />
      </g>

      <!-- small squares/diamonds -->
      <rect x="226" y="147" width="6" height="6" fill="#27272a" transform="rotate(45,229,150)" />
      <rect x="17" y="151" width="5.5" height="5.5" fill="#27272a" transform="rotate(45,19.75,153.75)" />
      <rect x="326" y="105" width="6" height="6" fill="#27272a" transform="rotate(45,329,108)" />
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#security-tile)" />
</svg>
